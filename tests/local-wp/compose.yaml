# Disposable local WordPress for theme/tool acceptance. Never points at staging or production.
# Start only through tests/local-wp/up.sh (it generates throwaway credentials in the environment).
name: cyberdat-tools-dev

services:
  db:
    image: mariadb@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577
    restart: "no"
    environment:
      MARIADB_DATABASE: wp_local
      MARIADB_USER: wp_local
      MARIADB_PASSWORD: ${LA_DB_PASSWORD:?generated by up.sh}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    networks: [internal]
    mem_limit: 512m

  wordpress:
    image: wordpress@sha256:bb954f75881438923ce702aa48d360a2a45f66ff3b4a1e45aac4876d5c007676
    restart: "no"
    depends_on: [db]
    ports:
      - "127.0.0.1:${LA_PORT:-8090}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wp_local
      WORDPRESS_DB_USER: wp_local
      WORDPRESS_DB_PASSWORD: ${LA_DB_PASSWORD:?generated by up.sh}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://127.0.0.1:${LA_PORT:-8090}' );
        define( 'WP_SITEURL', 'http://127.0.0.1:${LA_PORT:-8090}' );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'WP_HTTP_BLOCK_EXTERNAL', true );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
        define( 'WP_AUTO_UPDATE_CORE', false );
        define( 'DISABLE_WP_CRON', true );
        define( 'DISALLOW_FILE_MODS', true );
    volumes:
      - wordpress:/var/www/html
      - ../../wp-content/themes/cyberdat:/var/www/html/wp-content/themes/cyberdat:ro
      - ./seed.php:/opt/cyberdat-seed/seed.php:ro
      - ../../deploy/tools-log-anonymizer/editorial.json:/opt/cyberdat-seed/editorial.json:ro
      - ../../deploy/tools-prompt-injection-detector/editorial.json:/opt/cyberdat-seed/editorial-prompt-injection-detector.json:ro
      - ../../deploy/tools-lotl-analyzer/editorial.json:/opt/cyberdat-seed/editorial-lotl-command-analyzer.json:ro
      - ../../deploy/tools-mcp-checker/editorial.json:/opt/cyberdat-seed/editorial-mcp-security-checker.json:ro
    networks: [internal, web]
    mem_limit: 768m

volumes:
  db:
    name: cyberdat-tools-dev-db
  wordpress:
    name: cyberdat-tools-dev-wordpress

networks:
  internal:
    internal: true
  web: {}
