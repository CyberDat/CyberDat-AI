# Secret scan on every push and pull request, except the main branch (main is not touched).
# gitleaks scans the full history of the checked-out ref with .gitleaks.toml (default rules, synthetic values and
# test fixtures allowed by path) and .gitleaksignore (fingerprints of reviewed historical findings): old history
# passes, every new finding fails the job. Values are redacted in the log. Then no-token-shaped-strings.
# Actions are pinned by commit SHA; the gitleaks image by digest. No repository secrets are used.
name: Secret scan

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history, baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks v8.21.2
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE":/repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source /repo --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --no-banner --redact --verbose --exit-code 1

  no-token-shaped-strings:
    name: no-token-shaped-strings
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Node 24.14.1
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.14.1'
      - name: No token-shaped strings in tracked files
        run: node tests/no-token-shaped-strings.test.cjs
